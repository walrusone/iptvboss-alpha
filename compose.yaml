services:
  iptvboss:
    image: "ghcr.io/walrusone/iptvboss-alpha:${IPTVBOSS_TAG:-alpha}"
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 60s
    user: "${IPTVBOSS_UID:-10001}:${IPTVBOSS_GID:-10001}"
    ports:
      - "${IPTVBOSS_HOST_PORT:-8001}:8001"
    volumes:
      - iptvboss-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  iptvboss-data:
